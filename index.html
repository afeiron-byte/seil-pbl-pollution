  function findStudents(q) {
    q = String(q || '').trim();
    var all = (app.teacher && app.teacher.students) || [];
    if (!q) return all;
    return all.filter(function (s) { return s.sid.indexOf(q) >= 0 || s.name.indexOf(q) >= 0; });
  }

  async function resetStudentPw(sid) {
    var s = ((app.teacher && app.teacher.students) || []).filter(function (x) { return x.sid === sid; })[0];
    var who = s ? s.sid + ' ' + s.name : sid;
    var init = (app.teacher && app.teacher.initialPw) || 'seil1983';
    var ok = await choose('비밀번호를 초기화할까요?', who + ' 학생의 비밀번호를 초기 비밀번호(' + init + ')로 초기화합니다.\n학생은 ' + init + '로 로그인한 뒤 새 비밀번호를 정합니다.', [
      { label: '초기화', value: true, primary: true }, { label: '취소', value: false }]);
    if (!ok) return;
    try {
      var res = await api('apiTeacherResetPassword', app.token, sid);
      toast(res.message, !res.ok);
      if (res.ok) { $('tFind').value = ''; loadOverview(true); }
    } catch (err) { toast('서버에 연결하지 못했습니다.', true); }
  }

  async function loadOverview(force) {
    if (app.role !== 'teacher') return;
    if (app.teacher && !force && Date.now() - app.teacher.at < 30000) { renderOverview(); return; }
    try {
      var res = await api('apiTeacherOverview', app.token);
      if (!res.ok) { $('tTeams').innerHTML = $('tStudents').innerHTML = '<div class="warn-box">' + esc(res.message) + '</div>'; return; }
      res.at = Date.now();
      app.teacher = res;
      renderOverview();
    } catch (err) {
      $('tTeams').innerHTML = '<div class="warn-box">불러오지 못했습니다. [새로고침]을 눌러 주세요.</div>';
    }
  }

  }

    function end() { if (!forPrint) out.push('</div>'); }
    function fld(k, label) {
      var val = v[k], m = meta[k];
      var who = m && m.nm ? '마지막 저장: ' + m.nm + ' · ' + (m.at || '') : '';
      var has = val && String(val).trim();
      if (forPrint) out.push('<h3>' + esc(label || TF[k].label) + (who ? ' <span class="meta">(' + esc(who) + ')</span>' : '') + '</h3>' + pBox(val));
      else out.push('<div class="ro-label">' + esc(label || TF[k].label) + '<span>' + esc(who) + '</span></div><div class="ro' + (has ? '' : ' empty') + '">' + (has ? esc(val) : '(비어 있음)') + '</div>');
    }
    function table(head, body) { return (forPrint ? '<table>' : '<div class="table-wrap"><table class="tbl">') + '<thead><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + body.join('') + '</tbody></table>' + (forPrint ? '' : '</div>'); }

    var school = app.settings.school || BOOT.school || '';
    if (forPrint) out.push('<div class="top"><span>' + esc(school) + ' · 환경 오염 PBL 탐구</span><span>모둠 보고서</span></div>');
    out.push(forPrint ? '<h1>' + esc(d.label) + '</h1>' : '<div class="page-head"><span class="kicker">' + esc(d.label) + ' · 단계 ' + (r.steps || []).filter(Boolean).length + '/' + TEAM_STEPS + (v.published ? ' · 해결안 공개' : '') + '</span><h2>' + esc(v.p6_title || v.p1_dq || d.label + ' 보고서') + '</h2>');
    out.push((forPrint ? '<div class="meta">' : '<p>') + '구성원: ' + esc(d.members.map(function (m) { return m.sid + ' ' + m.name; }).join(', ')) + (r.savedAt ? ' · 최근 저장 ' + esc(r.savedAt) + ' (' + esc(r.savedBy || '') + ')' : '') + (forPrint ? '</div>' : '</p></div>'));

    sec('1. 문제 발견'); fld('p1_issue'); fld('p1_dq'); fld('p1_why'); end();
    sec('2. 문제 분석'); fld('p2_know'); fld('p2_need'); fld('p2_how'); end();
    sec('3. 역할 · 탐구 계획');
    var roles = v.roles || [];
    var rm = meta.roles;
    out.push((forPrint ? '<h3>3-1. 역할 분담</h3>' : '<div class="ro-label">3-1. 역할 분담<span>' + esc(rm && rm.nm ? '마지막 저장: ' + rm.nm + ' · ' + rm.at : '') + '</span></div>') +
      (roles.length ? table(['이름', '역할', '맡은 일'], roles.map(function (x) { return '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.role) + '</td><td>' + esc(x.task) + '</td></tr>'; })) : pBox('')));
    fld('p3_hypo'); fld('p3_places'); fld('p3_method'); end();
    sec('4. 장치 제작 · 측정');
    out.push(v.photo ? '<img src="' + esc(v.photo) + '" alt="장치 사진" style="max-width:100%;max-height:340px;border-radius:10px">' : '<p class="muted small">장치 사진 없음' + (r.photoMissing ? ' (파일을 찾을 수 없음)' : '') + '</p>');
    out.push('<p class="small">측정 기록 ' + rows.length + '건 · 장소 ' + groups.length + '곳' + (meta.csv && meta.csv.nm ? ' · 마지막 저장: ' + esc(meta.csv.nm) + ' · ' + esc(meta.csv.at) : '') + '</p>');
    if (groups.length) out.push(table(['장소', '기록 수'].concat(fs.map(function (f) { return f.short + (f.unit ? ' (' + f.unit + ')' : ''); })), groups.map(function (g) {
      return '<tr><td>' + esc(g.place) + '</td><td class="num n">' + g.n + '</td>' + fs.map(function (f) { return '<td class="num n">' + S.fmt(g.avg[f.key], f.avgDigits) + '</td>'; }).join('') + '</tr>';
    })));
    end();
    sec('5. 자료 분석');
    var ms = v.mapData || [];
    out.push('<p class="small"><b>지도 표시 장소</b> ' + (ms.length ? esc(ms.map(function (m) { return m.name + (m.summary ? ' (' + m.summary + ')' : ''); }).join(' · ')) : '없음') + '</p>');
    fld('p5_high_loc', '5-2. 가장 높은 곳'); fld('p5_high_cause', '5-2. 높은 곳의 원인'); fld('p5_low_loc', '5-2. 가장 낮은 곳'); fld('p5_low_cause', '5-2. 낮은 곳의 원인'); fld('p5_analysis'); end();
    sec('6. 해결안 발표 자료' + (v.published ? ' (공개함)' : ' (공개 안 함)'));
    fld('p6_title'); fld('p6_form', '6-1. 발표 형태'); fld('p6_target'); fld('p6_problem'); fld('p6_solution'); fld('p6_effect'); end();
    sec('7. 동료 피드백 · 수정');
    out.push('<p class="small"><b>받은 피드백 ' + d.feedbackIn.length + '개</b></p>');
    d.feedbackIn.forEach(function (f) { out.push(forPrint ? '<div class="fb"><b>' + esc(f.fromName) + '</b> (' + esc(f.fromLabel || '-') + ') ' + esc(f.savedAt) + '<br>' + (f.praise ? '좋은 점: ' + esc(f.praise) + '<br>' : '') + (f.question ? '궁금한 점: ' + esc(f.question) + '<br>' : '') + (f.suggest ? '제안: ' + esc(f.suggest) : '') + '</div>' : feedbackItemHtml(f, true)); });
    fld('p7_revise');
    out.push('<p class="small" style="margin-top:12px"><b>모둠원이 다른 모둠에 남긴 피드백 ' + d.feedbackOut.length + '개</b></p>');
    d.feedbackOut.forEach(function (f) { out.push(forPrint ? '<div class="fb"><b>' + esc(f.fromName) + '</b> → ' + esc(f.toLabel) + ' ' + esc(f.savedAt) + '<br>' + (f.praise ? '좋은 점: ' + esc(f.praise) + '<br>' : '') + (f.question ? '궁금한 점: ' + esc(f.question) + '<br>' : '') + (f.suggest ? '제안: ' + esc(f.suggest) : '') + '</div>' : feedbackItemHtml({ fromName: f.fromName, fromLabel: '→ ' + f.toLabel, savedAt: f.savedAt, praise: f.praise, question: f.question, suggest: f.suggest }, true)); });
    end();
    sec('8. 개인 성찰');
    d.reflections.forEach(function (x) {
      out.push(forPrint ? '<h3 style="margin-top:14px">' + esc(x.sid + ' ' + x.name) + ' <span class="meta">' + esc(x.savedAt ? '저장 ' + x.savedAt : '미작성') + '</span></h3>' : '<div class="ro-label" style="margin-top:16px;font-size:15px">' + esc(x.sid + ' ' + x.name) + '<span>' + esc(x.savedAt ? '저장 ' + x.savedAt + ' · ' + x.progress : '아직 쓰지 않음') + '</span></div>');
      REFLECT_KEYS.forEach(function (k) {
        if (forPrint) out.push('<div class="meta">' + esc(TF[k].label) + '</div>' + pBox(x[k]));
        else out.push('<div class="small muted" style="margin-top:6px">' + esc(TF[k].label) + '</div><div class="ro' + (x[k] ? '' : ' empty') + '">' + (x[k] ? esc(x[k]) : '(비어 있음)') + '</div>');
      });
    });
    end();
    if (!forPrint) out.push('<div class="card"><h3>평가 기준 (교사 전용)</h3>' + rubricHtml() + '</div>');
    return out.join('');
  }

  

  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-act="openStation"]')) { e.preventDefault(); openStation(); }
    else if (e.target.closest('[data-act="downloadStation"]')) { e.preventDefault(); downloadStation(); }
  });
  setInterval(renderStationChip, 3000);

  if (BOOT && BOOT.school) $('loginSchool').textContent = BOOT.school + ' · 우리 주변의 환경 문제를 측정하고 해결안을 만드는 모둠 프로젝트';
  var savedToken = ss(TOKEN_KEY);
  if (savedToken) {
    $('loginBtn').disabled = true;
    $('loginBtn').textContent = '다시 들어가는 중…';
    api('apiResume', savedToken).then(function (res) {
      if (res.ok) enter(res); else { ss(TOKEN_KEY, null); showLogin(res.message); }
    }).catch(function () { ss(TOKEN_KEY, null); showLogin(''); });
  } else {
    setTimeout(function () { $('loginId').focus(); }, 50);
  }
})();
</script>
</body>
</html>
