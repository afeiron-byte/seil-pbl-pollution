  .field + .field { margin-top: 18px; }

  .role-tbl td:first-child { white-space: nowrap; font-weight: 700; }

<script>
 
(function (global) {
  'use strict';

  var BOM = String.fromCharCode(0xFEFF); 
   
  var FONT_STACK = "'Malgun Gothic', '맑은 고딕', 'Nanum Gothic', '나눔고딕', 'Apple SD Gothic Neo', sans-serif";

  var FIELDS = [
    { key: 'pm25', label: '미세먼지 PM2.5', short: 'PM2.5', unit: 'µg/m³', digits: 0, avgDigits: 1, color: '#475569', csv: '미세먼지 PM2.5(µg/m³)' },
    { key: 'co2',  label: '이산화탄소 CO₂', short: 'CO₂',  unit: 'ppm',   digits: 0, avgDigits: 0, color: '#059669', csv: '이산화탄소 CO2(ppm)' },
    { key: 'voc',  label: '유기화합물 VOC', short: 'VOC',  unit: 'Lv',    digits: 0, avgDigits: 1, color: '#d97706', csv: 'VOC(Lv)' },
    { key: 'ph',   label: '수질 pH',        short: 'pH',   unit: '',      digits: 2, avgDigits: 2, color: '#9333ea', csv: '수질 pH' },
    { key: 'temp', label: '대기 온도',      short: '기온', unit: '°C',    digits: 1, avgDigits: 1, color: '#ea580c', csv: '대기 온도(°C)' },
    { key: 'humi', label: '대기 습도',      short: '습도', unit: '%',     digits: 1, avgDigits: 1, color: '#0284c7', csv: '대기 습도(%)' },
    { key: 'wtemp',label: '수온',           short: '수온', unit: '°C',    digits: 1, avgDigits: 1, color: '#4f46e5', csv: '수온(°C)' }
  ];
  var FIELD = {};
  FIELDS.forEach(function (f) { FIELD[f.key] = f; });

  var CSV_COLUMNS = [{ key: 'date', csv: '날짜' }, { key: 'time', csv: '시간' }, { key: 'place', csv: '장소' }]
    .concat(FIELDS.map(function (f) { return { key: f.key, csv: f.csv }; }))
    .concat([{ key: 'lat', csv: '위도' }, { key: 'lng', csv: '경도' }]);

   
  var HEADER_RULES = [
    ['date', /날짜|date/i], ['time', /시간|시각|time/i], ['place', /장소|place|location/i],
    ['wtemp', /수온|water/i], ['humi', /습도|humi/i], ['temp', /기온|온도|temp/i],
    ['pm25', /미세먼지|pm\s*2\.?5/i], ['co2', /이산화탄소|co2|co₂/i], ['voc', /voc|유기/i],
    ['ph', /수질|(^|[^a-z])ph([^a-z]|$)/i], ['lat', /위도|lat/i], ['lng', /경도|lng|lon/i]
  ];

  function num(v) {
    if (v === null || v === undefined) return null;
    var s = String(v).trim();
    if (s === '' || /^(nan|null|-|–)$/i.test(s)) return null;
    var n = Number(s);
    return isFinite(n) ? n : null;
  }

  function splitCsv(text) {
    var rows = [], row = [], cur = '', q = false, i, c;
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); rows.push(row); row = []; cur = '';
      } else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  function parseCsv(text) {
    text = String(text || '');
    if (text.charAt(0) === BOM) text = text.slice(1);
    var table = splitCsv(text).filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
    if (table.length < 1) return { rows: [], error: '비어 있는 파일입니다.' };
    var header = table[0].map(function (h) { return String(h).trim(); });
    var map = {};
    header.forEach(function (h, i) {
      for (var k = 0; k < HEADER_RULES.length; k++) {
        var key = HEADER_RULES[k][0];
        if (map[key] === undefined && HEADER_RULES[k][1].test(h)) { map[key] = i; break; }
      }
    });
    var measured = FIELDS.filter(function (f) { return map[f.key] !== undefined; });
    if (!measured.length) return { rows: [], error: '측정값 열(미세먼지, CO2, 온도 등)을 찾지 못했습니다. 측정 창에서 저장한 CSV 파일인지 확인하세요.' };
    var legacy = map.place === undefined && map.date === undefined;

    var rows = table.slice(1).map(function (cols) {
      var r = {
        date: map.date !== undefined ? String(cols[map.date] || '').trim() : '',
        time: map.time !== undefined ? String(cols[map.time] || '').trim() : '',
        place: map.place !== undefined ? String(cols[map.place] || '').trim().slice(0, 40) : ''
      };
      FIELDS.forEach(function (f) { r[f.key] = map[f.key] !== undefined ? num(cols[map[f.key]]) : null; });
      r.lat = map.lat !== undefined ? num(cols[map.lat]) : null;
      r.lng = map.lng !== undefined ? num(cols[map.lng]) : null;
      return r;
    });

    if (legacy) {
      
      rows.forEach(function (r) {
        if (r.co2 === 0) { r.pm25 = null; r.co2 = null; r.voc = null; }
        if (r.humi === 0) { r.temp = null; r.humi = null; }
        if (r.ph === 0) r.ph = null;
      });
      if (rows.length && rows.every(function (r) { return r.wtemp === null || r.wtemp === 0; })) {
        rows.forEach(function (r) { r.wtemp = null; });
      }
    }
    rows.forEach(function (r) {
      if (r.wtemp !== null && (r.wtemp <= -100 || r.wtemp === 85)) r.wtemp = null;
      if (r.lat === null || r.lng === null || r.lat === 0 || r.lng === 0 || Math.abs(r.lat) > 90 || Math.abs(r.lng) > 180) { r.lat = null; r.lng = null; }
    });
    return { rows: rows, legacy: legacy, hasPlace: map.place !== undefined };
  }

  function csvCell(v) {
    if (v === null || v === undefined) return '';
    var s = String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function toCsv(rows, opts) {
    var lines = [CSV_COLUMNS.map(function (c) { return c.csv; }).join(',')];
    rows.forEach(function (r) {
      lines.push(CSV_COLUMNS.map(function (c) {
        var v = r[c.key];
        if (typeof v === 'number') {
          if (c.key === 'lat' || c.key === 'lng') v = v.toFixed(6);
          else if (FIELD[c.key]) v = Number(v.toFixed(Math.max(FIELD[c.key].digits, 2)));
        }
        return csvCell(v);
      }).join(','));
    });
    return (opts && opts.bom ? BOM : '') + lines.join('\n') + '\n';
  }

  function stats(rows, key) {
    var vals = [];
    rows.forEach(function (r) { var v = r[key]; if (v !== null && v !== undefined && isFinite(v)) vals.push(Number(v)); });
    if (!vals.length) return null;
    var sum = 0, min = Infinity, max = -Infinity;
    vals.forEach(function (v) { sum += v; if (v < min) min = v; if (v > max) max = v; });
    return { n: vals.length, avg: sum / vals.length, min: min, max: max };
  }

   
  function byPlace(rows) {
    var order = [], groups = {};
    rows.forEach(function (r) {
      var p = r.place || '';
      if (!p) return;
      if (!groups[p]) { groups[p] = []; order.push(p); }
      groups[p].push(r);
    });
    return order.map(function (p) {
      var g = groups[p];
      var out = { place: p, n: g.length, avg: {} };
      FIELDS.forEach(function (f) { var s = stats(g, f.key); out.avg[f.key] = s ? s.avg : null; });
      var lat = stats(g, 'lat'), lng = stats(g, 'lng');
      out.lat = lat && lng ? lat.avg : null;
      out.lng = lat && lng ? lng.avg : null;
      out.first = (g[0].date ? g[0].date + ' ' : '') + (g[0].time || '');
      return out;
    });
  }

  function extremes(groups, key) {
    var withVal = groups.filter(function (g) { return g.avg[key] !== null; });
    if (withVal.length < 2) return null;
    var hi = withVal[0], lo = withVal[0];
    withVal.forEach(function (g) { if (g.avg[key] > hi.avg[key]) hi = g; if (g.avg[key] < lo.avg[key]) lo = g; });
    if (hi === lo) return null;
    return { max: hi, min: lo };
  }

  function fmt(v, digits) {
    if (v === null || v === undefined || !isFinite(v)) return '–';
    return Number(v).toFixed(digits);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function nowParts(d) {
    d = d || new Date();
    return {
      date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
      time: pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()),
      stamp: d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes())
    };
  }

   

  var BAND_COLORS = ['rgba(16,185,129,0.10)', 'rgba(59,130,246,0.10)', 'rgba(245,158,11,0.12)', 'rgba(168,85,247,0.10)', 'rgba(244,63,94,0.08)'];

   
  var placeBands = {
    id: 'placeBands',
    beforeDatasetsDraw: function (chart) {
      var places = chart.$places;
      if (!places || !places.length) return;
      var x = chart.scales.x, area = chart.chartArea, ctx = chart.ctx, n = places.length;
      var step = n > 1 ? Math.abs(x.getPixelForValue(1) - x.getPixelForValue(0)) : (area.right - area.left);
      var i = 0, k = 0;
      ctx.save();
      while (i < n) {
        var p = places[i], j = i;
        while (j + 1 < n && places[j + 1] === p) j++;
        if (p) {
          var x0 = Math.max(area.left, x.getPixelForValue(i) - step / 2);
          var x1 = Math.min(area.right, x.getPixelForValue(j) + step / 2);
          if (x1 > x0) {
            ctx.fillStyle = BAND_COLORS[k % BAND_COLORS.length];
            ctx.fillRect(x0, area.top, x1 - x0, area.bottom - area.top);
            ctx.strokeStyle = 'rgba(100,116,139,0.35)';
            ctx.setLineDash([3, 3]);
            ctx.beginPath(); ctx.moveTo(x0, area.top); ctx.lineTo(x0, area.bottom); ctx.stroke();
            ctx.setLineDash([]);
            if (x1 - x0 > 26) {
              ctx.fillStyle = '#334155';
              ctx.font = 'bold 11px ' + FONT_STACK;
              ctx.textBaseline = 'top';
              var label = p, maxW = x1 - x0 - 8;
              while (label.length > 1 && ctx.measureText(label).width > maxW) label = label.slice(0, -1);
              if (label !== p) label = label.slice(0, -1) + '…';
              ctx.fillText(label, x0 + 4, area.top + 4);
            }
          }
          k++;
        }
        i = j + 1;
      }
      ctx.restore();
    }
  };

   
  var whiteBg = {
    id: 'whiteBg',
    beforeDraw: function (chart) {
      var ctx = chart.ctx;
      ctx.save();
      ctx.globalCompositeOperation = 'destination-over';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, chart.width, chart.height);
      ctx.restore();
    }
  };

  function axis(position, title, color, extra) {
    var a = {
      type: 'linear', position: position, display: false,
      title: { display: true, text: title, font: { size: 11, weight: 'bold' }, color: color },
      ticks: { font: { size: 10 }, color: '#64748b' },
      grid: { drawOnChartArea: false }
    };
    for (var k in extra) a[k] = extra[k];
    return a;
  }

  function dataset(key, axisId, dashed) {
    var f = FIELD[key];
    return {
      key: key, label: f.short + (f.unit ? ' (' + f.unit + ')' : ''), data: [], yAxisID: axisId,
      borderColor: f.color, backgroundColor: f.color, borderWidth: 2, pointRadius: 2, pointHoverRadius: 4,
      borderDash: dashed ? [6, 4] : [], spanGaps: false, tension: 0.15
    };
  }

  function baseOptions(scales) {
    return {
      responsive: true, maintainAspectRatio: false, animation: false, normalized: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { boxWidth: 12, boxHeight: 2, font: { size: 11 } } } },
      scales: scales
    };
  }

  function createCharts(pollutionCanvas, climateCanvas) {
    if (window.Chart && Chart.defaults && Chart.defaults.font) Chart.defaults.font.family = FONT_STACK;
    var xAxis = { ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 8, color: '#64748b' }, grid: { color: 'rgba(148,163,184,0.15)' } };
    var pollution = new Chart(pollutionCanvas, {
      type: 'line', plugins: [placeBands, whiteBg],
      data: { labels: [], datasets: [dataset('pm25', 'yPm'), dataset('co2', 'yCo2'), dataset('voc', 'yVoc', true), dataset('ph', 'yPh')] },
      options: baseOptions({
        x: xAxis,
        yPm: axis('left', 'PM2.5 (µg/m³)', '#475569', { suggestedMin: 0, suggestedMax: 50, grid: { drawOnChartArea: true, color: 'rgba(148,163,184,0.18)' } }),
        yPh: axis('left', '수질 pH', '#9333ea', { min: 0, max: 14 }),
        yCo2: axis('right', 'CO₂ (ppm)', '#059669', { suggestedMin: 400, suggestedMax: 1000 }),
        yVoc: axis('right', 'VOC (Lv)', '#d97706', { suggestedMin: 0, suggestedMax: 3, ticks: { precision: 0, font: { size: 10 }, color: '#64748b' } })
      })
    });
    var climate = new Chart(climateCanvas, {
      type: 'line', plugins: [placeBands, whiteBg],
      data: { labels: [], datasets: [dataset('temp', 'yT'), dataset('wtemp', 'yT', true), dataset('humi', 'yH')] },
      options: baseOptions({
        x: xAxis,
        yT: axis('left', '기온 · 수온 (°C)', '#ea580c', { suggestedMin: 10, suggestedMax: 30, grid: { drawOnChartArea: true, color: 'rgba(148,163,184,0.18)' } }),
        yH: axis('right', '습도 (%)', '#0284c7', { min: 0, max: 100 })
      })
    });
    return { pollution: pollution, climate: climate };
  }

  function hasData(rows, key) {
    for (var i = 0; i < rows.length; i++) if (rows[i][key] !== null && rows[i][key] !== undefined) return true;
    return false;
  }

   
  function setChartData(charts, rows) {
    var labels = rows.map(function (r) { return r.time || ''; });
    var places = rows.map(function (r) { return r.place || ''; });
    var radius = rows.length > 120 ? 0 : 2;
    [charts.pollution, charts.climate].forEach(function (ch) {
      ch.data.labels = labels;
      ch.$places = places;
      var axisOn = {};
      ch.data.datasets.forEach(function (ds) {
        ds.data = rows.map(function (r) { var v = r[ds.key]; return v === undefined ? null : v; });
        var on = hasData(rows, ds.key);
        ds.hidden = !on;
        ds.pointRadius = radius;
        if (on) axisOn[ds.yAxisID] = true;
      });
      
      var scales = ch.config.options.scales;
      var gridSet = false; 
      Object.keys(scales).forEach(function (id) {
        if (id === 'x') return;
        var sc = scales[id];
        sc.display = !!axisOn[id];
        sc.grid.drawOnChartArea = !gridSet && !!axisOn[id];
        if (sc.grid.drawOnChartArea) gridSet = true;
      });
      ch.update('none');
    });
  }

  function anyData(rows) {
    return FIELDS.some(function (f) { return hasData(rows, f.key); });
  }


   
  var HELP = [
    { id: 'ide', title: '🛠️ 코드를 올릴 때 (아두이노 IDE)', items: [

-sl-200); border-radius: 8px; padding: 6px 8px; }\n  .helpbox .faq-group h4 { font-size: 12.5px; margin: 10px 0 4px; color: var(--sl-600); }\n  .helpbox .faq { border: 1px solid var(--sl-200); border-radius: 10px; padding: 7px 9px; margin-top: 6px; background: #fff; }\n  .helpbox .faq summary { cursor: pointer; font-weight: 700; font-size: 12.5px; line-height: 1.45; }\n  .helpbox .faq p { margin: 6px 0 2px; font-size: 12px; line-height: 1.55; color: var(--sl-600); }\n  .demo { border: 1px dashed var(--amber-700); background: var(--amber-50); border-radius: 12px; padding: 8px 10px; font-size: 12px; color: var(--amber-700); }\n\n  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: grid; place-items: center; z-index: 50; }\n  .modal-card { background: #fff; border-radius: 16px; padding: 20px; width: min(440px, 92vw); box-shadow: 0 20px 50px rgba(0,0,0,.2); }\n  .modal-card h3 { margin: 0 0 8px; font-size: 17px; }\n  .modal-card p { margin: 0 0 14px; font-size: 14px; color: var(--sl-600); line-height: 1.55; white-space: pre-line; }\n  .modal-actions { display: flex; flex-direction: column; gap: 8px; }\n\n  @media (max-width: 1200px) {\n    .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }\n    .main { grid-template-columns: 1fr; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cheader class=\"top\">\n    \u003cdiv class=\"brand\">\n      \u003cdiv class=\"logo\">🌿\u003c/div>\n      \u003cdiv>\u003ch1>실시간 관측소\u003c/h1>\u003cp id=\"schoolLine\">환경 오염 탐구 · 아두이노 측정 창\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"conn\">\n      \u003cbutton id=\"btnConnect\" class=\"btn btn-dark\">🔌 아두이노 연결하기\u003c/button>\n      \u003cspan id=\"connPill\" class=\"pill\">\u003ci>\u003c/i>\u003cb id=\"connText\">연결 대기 중\u003c/b>\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"raw\">\u003cspan>수신 데이터\u003c/span>\u003ccode id=\"rawLine\">연결 대기 중…\u003c/code>\u003c/div>\n  \u003c/header>\n\n  \u003cdiv id=\"banner\" class=\"banner hidden\">\u003c/div>\n\n  \u003csection id=\"recbar\" class=\"recbar\">\n    \u003cdiv class=\"place\">\n      \u003clabel for=\"placeInput\">지금 측정하는 장소\u003c/label>\n      \u003cinput id=\"placeInput\" maxlength=\"30\" placeholder=\"예: 정문 앞 도로변\" autocomplete=\"off\">\n      \u003cdiv id=\"placeChips\" class=\"chips\">\u003c/div>\n    \u003c/div>\n    \u003cbutton id=\"btnRec\" class=\"btn btn-rec\">● 기록 시작\u003c/button>\n    \u003cdiv class=\"recinfo\">\n      \u003cb id=\"recState\">기록 대기 중\u003c/b>\n      \u003cspan id=\"recCount\">기록 0건 · 장소 0곳\u003c/span>\n    \u003c/div>\n  \u003c/section>\n  \u003cp class=\"hint\">센서를 켜고 값이 안정되면(공기질 센서는 몇 분 예열) \u003cb>기록 시작\u003c/b>을 누르세요. 장소를 옮길 때는 \u003cb>기록 멈춤\u003c/b> → 장소 이름 변경 → 다시 \u003cb>기록 시작\u003c/b>. 기록 중인 값만 그래프·CSV·보고서에 들어갑니다.\u003c/p>\n\n  \u003csection id=\"cards\" class=\"cards\">\u003c/section>\n\n  \u003csection class=\"main\">\n    \u003cdiv class=\"panel\">\n      \u003cdiv class=\"ch-head\">\u003ch3>대기·수질 오염도\u003c/h3>\u003cbutton class=\"btn btn-sm\" data-img=\"pollution\">이미지 저장\u003c/button>\u003c/div>\n      \u003cdiv class=\"ch-body\">\u003ccanvas id=\"cPollution\">\u003c/canvas>\u003cdiv class=\"ch-empty\" id=\"emptyPollution\">기록을 시작하면 그래프가 그려집니다.\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\n      \u003cdiv class=\"ch-head\">\u003ch3>온습도·수온 변화\u003c/h3>\u003cbutton class=\"btn btn-sm\" data-img=\"climate\">이미지 저장\u003c/button>\u003c/div>\n      \u003cdiv class=\"ch-body\">\u003ccanvas id=\"cClimate\">\u003c/canvas>\u003cdiv class=\"ch-empty\" id=\"emptyClimate\">기록을 시작하면 그래프가 그려집니다.\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003caside class=\"panel side\">\n      \u003ch4>그래프 범위\u003c/h4>\n      \u003cdiv class=\"seg\" id=\"viewSeg\">\u003cbutton data-view=\"all\" class=\"on\">전체 기록\u003c/button>\u003cbutton data-view=\"recent\">최근 2분\u003c/button>\u003c/div>\n      \u003ch4>보고서·파일\u003c/h4>\n      \u003cbutton id=\"btnSend\" class=\"btn btn-primary btn-block\">📨 보고서로 보내기\u003c/button>\n      \u003cdiv id=\"sendMsg\" class=\"msg\">\u003c/div>\n      \u003cbutton id=\"btnCsv\" class=\"btn btn-block\">⬇ CSV 파일로 저장\u003c/button>\n      \u003cbutton id=\"btnMap\" class=\"btn btn-block\">🧭 구글 지도에서 현재 위치\u003c/button>\n      \u003cbutton id=\"btnClear\" class=\"btn btn-ghost btn-block\">기록 모두 지우기\u003c/button>\n      \u003cdetails class=\"box cal\" id=\"calBox\">\n        \u003csummary>pH 센서 보정\u003c/summary>\n        \u003cp>표준 용액에 전극을 담그고 값이 멈출 때까지(약 1분) 기다린 뒤 버튼을 누르세요. 용액을 바꿀 때는 증류수로 헹굽니다.\u003c/p>\n        \u003cdiv class=\"now\" id=\"calNow\">pH 신호 대기 중\u003c/div>\n        \u003cdiv class=\"row\">\u003cbutton class=\"btn btn-sm\" id=\"cal7\">pH 7 기준 저장\u003c/button>\u003cbutton class=\"btn btn-sm\" id=\"cal4\">pH 4 기준 저장\u003c/button>\u003c/div>\n        \u003cdiv class=\"row\">\u003cbutton class=\"btn btn-sm btn-ghost\" id=\"calReset\">보정 지우기\u003c/button>\u003c/div>\n        \u003cp id=\"calState\">보정 전 (기본 공식: pH = 3.5 × 전압)\u003c/p>\n      \u003c/details>\n      \u003cdetails class=\"box helpbox\" id=\"helpBox\">\n        \u003csummary>연결·센서 문제 해결\u003c/summary>\n        \u003cdiv id=\"helpBody\">\u003c/div>\n      \u003c/details>\n      \u003cdiv id=\"demoBox\" class=\"demo hidden\">\n        \u003cb>교사용 연습 모드\u003c/b>\u003cbr>아두이노 없이 가상 데이터로 흐름을 확인합니다.\n        \u003cdiv style=\"margin-top:6px\">\u003cbutton class=\"btn btn-sm\" id=\"btnDemo\">가상 데이터 시작\u003c/button>\u003c/div>\n      \u003c/div>\n    \u003c/aside>\n  \u003c/section>\n\u003c/div>\n\n\u003cdiv id=\"modal\" class=\"modal hidden\">\n  \u003cdiv class=\"modal-card\">\u003ch3 id=\"mTitle\">\u003c/h3>\u003cp id=\"mText\">\u003c/p>\u003cdiv class=\"modal-actions\" id=\"mActions\">\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cscript>\n \n(function (global) {\n  'use strict';\n\n  var BOM = String.fromCharCode(0xFEFF); \n   \n  var FONT_STACK = \"'Malgun Gothic', '맑은 고딕', 'Nanum Gothic', '나눔고딕', 'Apple SD Gothic Neo', sans-serif\";\n\n  var FIELDS = [\n    { key: 'pm25', label: '미세먼지 PM2.5', short: 'PM2.5', unit: 'µg/m³', digits: 0, avgDigits: 1, color: '#475569', csv: '미세먼지 PM2.5(µg/m³)' },\n    { key: 'co2',  label: '이산화탄소 CO₂', short: 'CO₂',  unit: 'ppm',   digits: 0, avgDigits: 0, color: '#059669', csv: '이산화탄소 CO2(ppm)' },\n    { key: 'voc',  label: '유기화합물 VOC', short: 'VOC',  unit: 'Lv',    digits: 0, avgDigits: 1, color: '#d97706', csv: 'VOC(Lv)' },\n    { key: 'ph',   label: '수질 pH',        short: 'pH',   unit: '',      digits: 2, avgDigits: 2, color: '#9333ea', csv: '수질 pH' },\n    { key: 'temp', label: '대기 온도',      short: '기온', unit: '°C',    digits: 1, avgDigits: 1, color: '#ea580c', csv: '대기 온도(°C)' },\n    { key: 'humi', label: '대기 습도',      short: '습도', unit: '%',     digits: 1, avgDigits: 1, color: '#0284c7', csv: '대기 습도(%)' },\n    { key: 'wtemp',label: '수온',           short: '수온', unit: '°C',    digits: 1, avgDigits: 1, color: '#4f46e5', csv: '수온(°C)' }\n  ];\n  var FIELD = {};\n  FIELDS.forEach(function (f) { FIELD[f.key] = f; });\n\n  var CSV_COLUMNS = [{ key: 'date', csv: '날짜' }, { key: 'time', csv: '시간' }, { key: 'place', csv: '장소' }]\n    .concat(FIELDS.map(function (f) { return { key: f.key, csv: f.csv }; }))\n    .concat([{ key: 'lat', csv: '위도' }, { key: 'lng', csv: '경도' }]);\n\n   \n  var HEADER_RULES = [\n    ['date', /날짜|date/i], ['time', /시간|시각|time/i], ['place', /장소|place|location/i],\n    ['wtemp', /수온|water/i], ['humi', /습도|humi/i], ['temp', /기온|온도|temp/i],\n    ['pm25', /미세먼지|pm\\s*2\\.?5/i], ['co2', /이산화탄소|co2|co₂/i], ['voc', /voc|유기/i],\n    ['ph', /수질|(^|[^a-z])ph([^a-z]|$)/i], ['lat', /위도|lat/i], ['lng', /경도|lng|lon/i]\n  ];\n\n  function num(v) {\n    if (v === null || v === undefined) return null;\n    var s = String(v).trim();\n    if (s === '' || /^(nan|null|-|–)$/i.test(s)) return null;\n    var n = Number(s);\n    return isFinite(n) ? n : null;\n  }\n\n  function splitCsv(text) {\n    var rows = [], row = [], cur = '', q = false, i, c;\n    for (i = 0; i \u003c text.length; i++) {\n      c = text[i];\n      if (q) {\n        if (c === '\"' && text[i + 1] === '\"') { cur += '\"'; i++; }\n        else if (c === '\"') q = false;\n        else cur += c;\n      } else if (c === '\"') q = true;\n      else if (c === ',') { row.push(cur); cur = ''; }\n      else if (c === '\\n' || c === '\\r') {\n        if (c === '\\r' && text[i + 1] === '\\n') i++;\n        row.push(cur); rows.push(row); row = []; cur = '';\n      } else cur += c;\n    }\n    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }\n    return rows;\n  }\n\n  function parseCsv(text) {\n    text = String(text || '');\n    if (text.charAt(0) === BOM) text = text.slice(1);\n    var table = splitCsv(text).filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });\n    if (table.length \u003c 1) return { rows: [], error: '비어 있는 파일입니다.' };\n    var header = table[0].map(function (h) { return String(h).trim(); });\n    var map = {};\n    header.forEach(function (h, i) {\n      for (var k = 0; k \u003c HEADER_RULES.length; k++) {\n        var key = HEADER_RULES[k][0];\n        if (map[key] === undefined && HEADER_RULES[k][1].test(h)) { map[key] = i; break; }\n      }\n    });\n    var measured = FIELDS.filter(function (f) { return map[f.key] !== undefined; });\n    if (!measured.length) return { rows: [], error: '측정값 열(미세먼지, CO2, 온도 등)을 찾지 못했습니다. 측정 창에서 저장한 CSV 파일인지 확인하세요.' };\n    var legacy = map.place === undefined && map.date === undefined;\n\n    var rows = table.slice(1).map(function (cols) {\n      var r = {\n        date: map.date !== undefined ? String(cols[map.date] || '').trim() : '',\n        time: map.time !== undefined ? String(cols[map.time] || '').trim() : '',\n        place: map.place !== undefined ? String(cols[map.place] || '').trim().slice(0, 40) : ''\n      };\n      FIELDS.forEach(function (f) { r[f.key] = map[f.key] !== undefined ? num(cols[map[f.key]]) : null; });\n      r.lat = map.lat !== undefined ? num(cols[map.lat]) : null;\n      r.lng = map.lng !== undefined ? num(cols[map.lng]) : null;\n      return r;\n    });\n\n    if (legacy) {\n      \n      rows.forEach(function (r) {\n        if (r.co2 === 0) { r.pm25 = null; r.co2 = null; r.voc = null; }\n        if (r.humi === 0) { r.temp = null; r.humi = null; }\n        if (r.ph === 0) r.ph = null;\n      });\n      if (rows.length && rows.every(function (r) { return r.wtemp === null || r.wtemp === 0; })) {\n        rows.forEach(function (r) { r.wtemp = null; });\n      }\n    }\n    rows.forEach(function (r) {\n      if (r.wtemp !== null && (r.wtemp \u003c= -100 || r.wtemp === 85)) r.wtemp = null;\n      if (r.lat === null || r.lng === null || r.lat === 0 || r.lng === 0 || Math.abs(r.lat) > 90 || Math.abs(r.lng) > 180) { r.lat = null; r.lng = null; }\n    });\n    return { rows: rows, legacy: legacy, hasPlace: map.place !== undefined };\n  }\n\n  function csvCell(v) {\n    if (v === null || v === undefined) return '';\n    var s = String(v);\n    return /[\",\\n\\r]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s;\n  }\n\n  function toCsv(rows, opts) {\n    var lines = [CSV_COLUMNS.map(function (c) { return c.csv; }).join(',')];\n    rows.forEach(function (r) {\n      lines.push(CSV_COLUMNS.map(function (c) {\n        var v = r[c.key];\n        if (typeof v === 'number') {\n          if (c.key === 'lat' || c.key === 'lng') v = v.toFixed(6);\n          else if (FIELD[c.key]) v = Number(v.toFixed(Math.max(FIELD[c.key].digits, 2)));\n        }\n        return csvCell(v);\n      }).join(','));\n    });\n    return (opts && opts.bom ? BOM : '') + lines.join('\\n') + '\\n';\n  }\n\n  function stats(rows, key) {\n    var vals = [];\n    rows.forEach(function (r) { var v = r[key]; if (v !== null && v !== undefined && isFinite(v)) vals.push(Number(v)); });\n    if (!vals.length) return null;\n    var sum = 0, min = Infinity, max = -Infinity;\n    vals.forEach(function (v) { sum += v; if (v \u003c min) min = v; if (v > max) max = v; });\n    return { n: vals.length, avg: sum / vals.length, min: min, max: max };\n  }\n\n   \n  function byPlace(rows) {\n    var order = [], groups = {};\n    rows.forEach(function (r) {\n      var p = r.place || '';\n      if (!p) return;\n      if (!groups[p]) { groups[p] = []; order.push(p); }\n      groups[p].push(r);\n    });\n    return order.map(function (p) {\n      var g = groups[p];\n      var out = { place: p, n: g.length, avg: {} };\n      FIELDS.forEach(function (f) { var s = stats(g, f.key); out.avg[f.key] = s ? s.avg : null; });\n      var lat = stats(g, 'lat'), lng = stats(g, 'lng');\n      out.lat = lat && lng ? lat.avg : null;\n      out.lng = lat && lng ? lng.avg : null;\n      out.first = (g[0].date ? g[0].date + ' ' : '') + (g[0].time || '');\n      return out;\n    });\n  }\n\n  function extremes(groups, key) {\n    var withVal = groups.filter(function (g) { return g.avg[key] !== null; });\n    if (withVal.length \u003c 2) return null;\n    var hi = withVal[0], lo = withVal[0];\n    withVal.forEach(function (g) { if (g.avg[key] > hi.avg[key]) hi = g; if (g.avg[key] \u003c lo.avg[key]) lo = g; });\n    if (hi === lo) return null;\n    return { max: hi, min: lo };\n  }\n\n  function fmt(v, digits) {\n    if (v === null || v === undefined || !isFinite(v)) return '–';\n    return Number(v).toFixed(digits);\n  }\n\n  function escapeHtml(s) {\n    return String(s == null ? '' : s).replace(/[&\u003c>\"']/g, function (c) {\n      return { '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c];\n    });\n  }\n\n  function pad(n) { return (n \u003c 10 ? '0' : '') + n; }\n  function nowParts(d) {\n    d = d || new Date();\n    return {\n      date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),\n      time: pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()),\n      stamp: d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes())\n    };\n  }\n\n   \n\n  var BAND_COLORS = ['rgba(16,185,129,0.10)', 'rgba(59,130,246,0.10)', 'rgba(245,158,11,0.12)', 'rgba(168,85,247,0.10)', 'rgba(244,63,94,0.08)'];\n\n   \n  var placeBands = {\n    id: 'placeBands',\n    beforeDatasetsDraw: function (chart) {\n      var places = chart.$places;\n      if (!places || !places.length) return;\n      var x = chart.scales.x, area = chart.chartArea, ctx = chart.ctx, n = places.length;\n      var step = n > 1 ? Math.abs(x.getPixelForValue(1) - x.getPixelForValue(0)) : (area.right - area.left);\n      var i = 0, k = 0;\n      ctx.save();\n      while (i \u003c n) {\n        var p = places[i], j = i;\n        while (j + 1 \u003c n && places[j + 1] === p) j++;\n        if (p) {\n          var x0 = Math.max(area.left, x.getPixelForValue(i) - step / 2);\n          var x1 = Math.min(area.right, x.getPixelForValue(j) + step / 2);\n          if (x1 > x0) {\n            ctx.fillStyle = BAND_COLORS[k % BAND_COLORS.length];\n            ctx.fillRect(x0, area.top, x1 - x0, area.bottom - area.top);\n            ctx.strokeStyle = 'rgba(100,116,139,0.35)';\n            ctx.setLineDash([3, 3]);\n            ctx.beginPath(); ctx.moveTo(x0, area.top); ctx.lineTo(x0, area.bottom); ctx.stroke();\n            ctx.setLineDash([]);\n            if (x1 - x0 > 26) {\n              ctx.fillStyle = '#334155';\n              ctx.font = 'bold 11px ' + FONT_STACK;\n              ctx.textBaseline = 'top';\n              var label = p, maxW = x1 - x0 - 8;\n              while (label.length > 1 && ctx.measureText(label).width > maxW) label = label.slice(0, -1);\n              if (label !== p) label = label.slice(0, -1) + '…';\n              ctx.fillText(label, x0 + 4, area.top + 4);\n            }\n          }\n          k++;\n        }\n        i = j + 1;\n      }\n      ctx.restore();\n    }\n  };\n\n   \n  var whiteBg = {\n    id: 'whiteBg',\n    beforeDraw: function (chart) {\n      var ctx = chart.ctx;\n      ctx.save();\n      ctx.g   function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      function done(res) {
        if (res && res.ok === false && res.code === 'AUTH') { backToLogin(res.message); reject(new Error(res.message)); return; }
        resolve(res || { ok: false, message: '서버 응답이 없습니다.' });
      }
      if (window.PBL_API_URL) {
        fetch(window.PBL_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ fn: fn, args: args }),
          redirect: 'follow',
          credentials: 'omit'
        }).then(function (r) { return r.text(); }, function () {
          throw new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.');
        }).then(function (txt) {
          var res;
          try { res = JSON.parse(txt); } catch (e) { throw new Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해 주세요.'); }
          done(res);
        }).catch(reject);
        return;
      }
      var runner = google.script.run
        .withSuccessHandler(done)
        .withFailureHandler(function (err) { reject(err || new Error('서버에 연결하지 못했습니다.')); });
      runner[fn].apply(runner, args);
    });
  }

  function normalize(k, v) {
    if (v === undefined || v === null) return emptyValue(k);

  function applyWork(res, merge) {
    app.me = res.me;
    app.members = res.members || [];
    app.teamless = !res.me.team;
    app.feedbackIn = res.feedbackIn || [];
    app.myFeedback = res.myFeedback || [];
    var t = res.team;
    var changed = [];
    if (t) {
      app.meta = t.meta || {};
      TEAM_KEYS.forEach(function (k) {
        var sv = normalize(k, t.values ? t.values[k] : undefined);
        var srev = (app.meta[k] && app.meta[k].r) || 0;
        if (!merge || !app.dirty[k]) {
          if (merge && !same(app.local[k], sv)) changed.push(k);
          app.local[k] = sv; app.rev[k] = srev; app.dirty[k] = false; delete app.conflict[k];
        } else if (srev !== (app.rev[k] || 0)) {
          var m = app.meta[k] || {};
          app.conflict[k] = { key: k, rev: srev, value: sv, by: m.by || '', nm: m.nm || '', at: m.at || '' };
        }
      });
      app.teamInfo = { savedAt: t.savedAt, savedBy: t.savedBy, progress: t.progress, photoMissing: t.photoMissing, csvMissing: t.csvMissing };
    } else {
      TEAM_KEYS.forEach(function (k) { app.local[k] = emptyValue(k); app.rev[k] = 0; });
      app.meta = {};
    }
    if (!merge || !app.reflDirty) {
      REFLECT_KEYS.forEach(function (k) { app.refl[k] = res.reflection ? String(res.reflection[k] || '') : ''; });
      app.reflDirty = false;
    }
    app.reflInfo = res.reflection ? { savedAt: res.reflection.savedAt, progress: res.reflection.progress } : {};
    app.rows = parseRows(app.local.csv);
    return changed;
  }

  function pageS8() {

  function bindTeamFields() {
    TEAM_TEXT_KEYS.forEach(function (k) {

      var el = $('f_' + k);
      el.addEventListener('input', function () {
        app.refl[k] = el.value; app.reflDirty = true; app.lastChange = Date.now();

        autoGrow(el);
        updateSaveState();
      });

  function fillAll() {
    TEAM_TEXT_KEYS.forEach(fillText);
    REFLECT_KEYS.forEach(function (k) {
      var el = $('f_' + k);
      if (el && document.activeElement !== el) { el.value = app.refl[k] || ''; autoGrow(el); }
      if ($('fw_' + k)) $('fw_' + k).classList.toggle('is-dirty', !!app.reflDirty && false);
    });
    renderRoles();
    renderPhoto();
    renderData();
    renderMarkers();
    renderPublish();

    updateSaveState();

  function fillText(k) {
    var el = $('f_' + k);
    if (!el) return;
    var v = app.local[k] == null ? '' : app.local[k];
    if (el.value !== v) el.value = v;
    autoGrow(el);
  }

  function setLocal(k, v) {
    app.local[k] = v;
    app.dirty[k] = true;
    app.lastChange = Date.now();
    renderFieldState(k);
    if (k === 'p1_dq' && $('s2dq')) $('s2dq').textContent = v || '1단계에서 추진 질문을 먼저 정하세요.';
    if (k === 'p6_title' || k === 'p6_solution') renderPublish();
    refreshProgress();
    updateSaveState();
  }

   
  function renderFieldState(k) {
    var wrap = $('fw_' + k);
    if (wrap) wrap.classList.toggle('is-dirty', !!app.dirty[k]);
    var m = $('m_' + k);
    if (m) {
      var meta = app.meta[k];
      var txt = meta && meta.nm ? '마지막 저장: <b>' + esc(meta.nm) + '</b> · ' + esc(meta.at || '') : '';
      if (app.dirty[k]) txt += (txt ? ' · ' : '') + '<span style="color:#b45309;font-weight:700">저장 안 됨</span>';
      m.innerHTML = txt;
    }
    var c = $('c_' + k);
    if (!c) return;
    var cf = app.conflict[k];
    if (!cf) { c.classList.add('hidden'); c.innerHTML = ''; return; }
    var isText = TEAM_TEXT_KEYS.indexOf(k) >= 0;
    var shown = '';
    if (isText) shown = '<pre>' + esc(cf.value || '(빈 칸)') + '</pre>';
    else if (k === 'roles') shown = '<pre>' + esc((cf.value || []).map(function (r) { return r.name + ': ' + (r.role || '') + ' / ' + (r.task || ''); }).join('\n') || '(빈 칸)') + '</pre>';
    else if (k === 'mapData') shown = '<pre>' + esc((cf.value || []).map(function (r) { return r.name; }).join(', ') || '(표시 없음)') + '</pre>';
    else if (k === 'csv') shown = '<pre>모둠원이 저장한 측정 기록 ' + parseRows(cf.value).length + '건</pre>';
    else if (k === 'photo') shown = cf.value ? '<img src="' + esc(cf.value) + '" style="max-width:220px;border-radius:8px;display:block;margin:8px 0">' : '<pre>(사진 없음)</pre>';
    else if (k === 'published') shown = '<pre>' + (cf.value ? '공개함' : '공개하지 않음') + '</pre>';
    c.innerHTML = '<b>' + esc(cf.nm || '다른 모둠원') + '</b>' + (cf.at ? '(' + esc(cf.at) + ')' : '') + '이(가) 이 칸을 먼저 고쳐 저장했어요. 내가 고친 내용은 아직 저장되지 않았습니다.' +
      '<div class="small" style="margin-top:6px">모둠원이 저장한 내용:</div>' + shown +
      '<div class="btn-row">' +
      '<button type="button" class="btn btn-sm" data-cf="theirs" data-k="' + k + '">모둠원 내용으로 바꾸기</button>' +
      (isText ? '<button type="button" class="btn btn-sm" data-cf="merge" data-k="' + k + '">모둠원 내용 아래에 내 글 이어 붙이기</button>' : '') +
      (k === 'csv' ? '<button type="button" class="btn btn-sm" data-cf="merge" data-k="' + k + '">두 기록 합치기</button>' : '') +
      '<button type="button" class="btn btn-sm btn-danger" data-cf="mine" data-k="' + k + '">내 내용으로 덮어쓰기</button></div>';
    c.classList.remove('hidden');
  }

  function resolveConflict(k, how) {
    var cf = app.conflict[k];
    if (!cf) return;
    if (how === 'theirs') {
      app.local[k] = cf.value; app.dirty[k] = false;
    } else if (how === 'merge') {
      if (k === 'csv') app.local[k] = S.toCsv(parseRows(cf.value).concat(parseRows(app.local[k])));
      else app.local[k] = (cf.value ? cf.value + '\n\n' : '') + (app.local[k] || '');
      app.dirty[k] = true;
    } else {
      app.dirty[k] = true;
    }
    app.rev[k] = cf.rev;
    delete app.conflict[k];
    afterValueChange(k);
    if (app.dirty[k]) saveNow({ quiet: true });
  }

   
  function afterValueChange(k) {
    if (TEAM_TEXT_KEYS.indexOf(k) >= 0) fillText(k);
    if (k === 'roles') renderRoles();
    if (k === 'photo') renderPhoto();
    if (k === 'csv') { app.rows = parseRows(app.local.csv); renderData(); if (app.page === 's5') onShowAnalysis(); }
    if (k === 'mapData') renderMarkers();
    if (k === 'published' || k === 'p6_title' || k === 'p6_solution') renderPublish();
    if (k === 'p1_dq' && $('s2dq')) $('s2dq').textContent = app.local.p1_dq || '1단계에서 추진 질문을 먼저 정하세요.';
    renderFieldState(k);
    refreshProgress();
    updateSaveState();
  }

  function renderReflMeta() {
    var m = $('reflMeta');
    if (!m) return;
    m.innerHTML = app.reflInfo && app.reflInfo.savedAt ? '마지막 저장: ' + esc(app.reflInfo.savedAt) + ' · 작성 ' + esc(app.reflInfo.progress || '') : '아직 저장하지 않았습니다.';
    REFLECT_KEYS.forEach(function (k) { if ($('fw_' + k)) $('fw_' + k).classList.toggle('is-dirty', !!app.reflDirty); });
  }

   
  function hasText(k) { return !!String(app.local[k] || '').trim(); }
  function localSteps() {
    var roles = app.local.roles || [];
    return [
      hasText('p1_issue') && hasText('p1_dq') && hasText('p1_why'),
      hasText('p2_know') && hasText('p2_need') && hasText('p2_how'),
      roles.some(function (r) { return r.role; }) && hasText('p3_hypo') && hasText('p3_places') && hasText('p3_method'),
      !!app.local.photo && app.rows.length > 0,
      hasText('p5_high_loc') && hasText('p5_low_loc') && hasText('p5_analysis'),
      hasText('p6_title') && hasText('p6_problem') && hasText('p6_solution') && !!app.local.published,
      hasText('p7_revise')
    ];
  }

  function refreshProgress() {
    if (!$('navBar')) return;
    var steps = localSteps();
    var done = steps.filter(Boolean).length;
    $('navTeam').textContent = app.teamless ? '모둠 미배정' : teamLabel(app.me.team) + ' 프로젝트';
    $('navMembers').textContent = app.members.map(function (m) { return m.name; }).join(', ');
    $('navBar').style.width = Math.round(done / TEAM_STEPS * 100) + '%';
    $('navProg').textContent = '모둠 단계 ' + done + '/' + TEAM_STEPS + ' 완료';
    var reflDone = REFLECT_KEYS.every(function (k) { return String(app.refl[k] || '').trim(); });
    Array.prototype.forEach.call(document.querySelectorAll('#nav .nav-btn'), function (b) {
      var id = b.getAttribute('data-page');
      var m = /^s(\d)$/.exec(id);
      if (!m) return;
      var i = Number(m[1]) - 1;
      var ok = i < 7 ? steps[i] : reflDone;
      b.classList.toggle('done', ok);
      b.querySelector('.nav-num').textContent = ok ? '✓' : String(i + 1);
    });
  }

  

  function dirtyKeys() { return TEAM_KEYS.filter(function (k) { return app.dirty[k]; }); }
  function hasUnsaved() { return dirtyKeys().length > 0 || app.reflDirty; }

  function updateSaveState(mode, text) {
    var el = $('saveState');
    if (!el || app.role !== 'student') return;
    el.className = 'save-state';
    if (mode === 'saving') { el.textContent = '저장 중…'; return; }
    if (mode === 'err') { el.classList.add('err'); el.textContent = text || '저장하지 못했습니다'; return; }
    var n = dirtyKeys().length + (app.reflDirty ? 1 : 0);
    var nc = Object.keys(app.conflict).length;
    if (nc) { el.classList.add('err'); el.textContent = '확인할 칸 ' + nc + '개'; return; }
    if (n) { el.classList.add('dirty'); el.textContent = '저장 안 된 변경 ' + n + '곳'; return; }
    el.classList.add('ok');
    el.textContent = app.lastSaved ? '모두 저장됨 · ' + app.lastSaved : '';
  }

  async function saveNow(opts) {
    opts = opts || {};
    if (app.role !== 'student') return false;
    if (app.saving) { app.saveAgain = true; return false; }
    var keys = dirtyKeys().filter(function (k) { return !app.conflict[k]; });
    if (app.teamless) keys = [];
    var payload = {}, snap = {}, reflSnap = null;
    if (keys.length) {
      var changes = {};
      keys.forEach(function (k) { changes[k] = { rev: app.rev[k] || 0, value: app.local[k] }; snap[k] = clone(app.local[k]); });
      payload.team = { changes: changes };
    }
    if (app.reflDirty) {
      payload.reflection = {};
      REFLECT_KEYS.forEach(function (k) { payload.reflection[k] = app.refl[k] || ''; });
      reflSnap = JSON.stringify(payload.reflection);
    }
    if (!payload.team && !payload.reflection) {
      if (!opts.quiet) toast(Object.keys(app.conflict).length ? '빨간 상자의 칸을 먼저 정리해 주세요.' : '저장할 변경 내용이 없습니다.');
      updateSaveState();
      return true;
    }
    app.saving = true;
    updateSaveState('saving');
    try {
      var res = await api('apiSaveWork', app.token, payload);
      if (!res.ok) {
        updateSaveState('err', '저장하지 못했습니다');
        if (res.code === 'MUST_CHANGE') openPw(true);
        toast(res.message, true);
        return false;
      }
      if (res.team) {
        app.meta = res.team.meta || app.meta;
        (res.team.saved || []).forEach(function (k) {
          app.rev[k] = (app.meta[k] && app.meta[k].r) || 0;
          if (same(app.local[k], snap[k])) app.dirty[k] = false;
        });
        (res.team.conflicts || []).forEach(function (c) {
          app.conflict[c.key] = { key: c.key, rev: c.rev, value: normalize(c.key, c.value), by: c.by, nm: c.nm, at: c.at };
        });
        app.teamInfo.savedAt = res.team.savedAt; app.teamInfo.savedBy = res.team.savedBy;
        TEAM_KEYS.forEach(renderFieldState);
        if ((res.team.conflicts || []).length) {
          toast('모둠원이 먼저 고친 칸이 ' + res.team.conflicts.length + '개 있어요. 빨간 상자를 확인하세요.', true);
          var first = res.team.conflicts[0].key;
          var pageOf = pageOfKey(first);
          if (pageOf && !opts.quiet) showPage(pageOf);
        }
      }
      if (res.reflection) {
        var nowRefl = {};
        REFLECT_KEYS.forEach(function (k) { nowRefl[k] = app.refl[k] || ''; });
        if (JSON.stringify(nowRefl) === reflSnap) app.reflDirty = false;
        app.reflInfo = res.reflection;
        renderReflMeta();
      }
      var d = new Date();
      app.lastSaved = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
      updateSaveState();
      refreshProgress();
      if (!opts.quiet && !(res.team && res.team.conflicts && res.team.conflicts.length)) toast('저장했습니다.');
      return true;
    } catch (err) {
      updateSaveState('err', '저장하지 못했습니다 (연결 확인)');
      if (!opts.quiet) toast('저장하지 못했습니다. 인터넷 연결을 확인하고 다시 저장하세요.', true);
      return false;
    } finally {
      app.saving = false;
      if (app.saveAgain) { app.saveAgain = false; setTimeout(function () { saveNow({ quiet: true }); }, 400); }
    }
  }

  function pageOfKey(k) {
    if (/^p1_/.test(k)) return 's1';
    if (/^p2_/.test(k)) return 's2';
    if (/^p3_/.test(k) || k === 'roles') return 's3';
    if (k === 'photo' || k === 'csv') return 's4';
    if (/^p5_/.test(k) || k === 'mapData') return 's5';
    if (/^p6_/.test(k) || k === 'published') return 's6';
    if (k === 'p7_revise') return 's7';
    return '';
  }

  $('btnSave').onclick = function () { saveNow({}); };
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S') && app.role === 'student') { e.preventDefault(); saveNow({}); }
  });
  window.addEventListener('beforeunload', function (e) {
    if (app.role === 'student' && app.token && hasUnsaved()) { e.preventDefault(); e.returnValue = ''; }
  });

   
  var timers = [];
  function startPolling() {
    stopPolling();
    timers.push(setInterval(function () {
      if (app.role === 'student' && !app.saving && hasUnsaved() && Date.now() - app.lastChange > 20000) saveNow({ quiet: true });
    }, 10000));
    timers.push(setInterval(checkTeamChanges, 60000));
  }
  function stopPolling() { timers.forEach(clearInterval); timers = []; }

  async function checkTeamChanges() {
    if (app.role !== 'student' || app.teamless || app.saving || document.hidden) return;
    try {
      var st = await api('apiTeamStatus', app.token);
      if (!st.ok) return;
      var meta = st.meta || {};
      var newer = TEAM_KEYS.filter(function (k) { return meta[k] && (meta[k].r || 0) > (app.rev[k] || 0) && !app.conflict[k]; });
      if (!newer.length) return;
      await syncTeam(true);
    } catch (e) {   }
  }

  async function syncTeam(silent) {
    var res = await api('apiGetWork', app.token);
    if (!res.ok) { if (!silent) toast(res.message, true); return; }
    var changed = applyWork(res, true);
    changed.forEach(function (k) { afterValueChange(k); });
    TEAM_KEYS.forEach(renderFieldState);
    renderFeedbackIn();
    refreshProgress();
    updateSaveState();
    var names = [];
    changed.forEach(function (k) { var m = app.meta[k]; if (m && m.nm && names.indexOf(m.nm) < 0) names.push(m.nm); });
    if (changed.length) toast((names.join(', ') || '모둠원') + '이(가) 고친 내용 ' + changed.length + '곳을 불러왔어요.');
    else if (!silent) toast('새로 바뀐 내용이 없습니다.');
    var nc = Object.keys(app.conflict).length;
    if (nc) toast('내가 고치는 중인 칸을 모둠원도 고쳤어요. 빨간 상자 ' + nc + '개를 확인하세요.', true);
  }

    $('roleBody').addEventListener('input', function () {
      var arr = [];
      Array.prototype.forEach.call($('roleBody').querySelectorAll('tr[data-sid]'), function (tr) {
        arr.push({
          sid: tr.getAttribute('data-sid'), name: tr.getAttribute('data-name'),

        });

    var body = $('roleBody');

        '<td><input type="text" list="roleList" maxlength="40" data-r="role" value="' + esc(r.role || '') + '" placeholder="역할"' + dis + '></td>' +
        '<td><input type="text" maxlength="300" data-r="task" value="' + esc(r.task || '') + '" placeholder="맡은 일 (예: 측정 일정 짜기, 장소별 기록 확인)"' + dis + '></td></tr>';
    }).join('');

  function needTeam() {
    if (app.teamless) { toast('모둠이 배정된 뒤에 할 수 있어요.', true); return false; }
    return true;
  }

  function bindPhoto() {
    $('btnPhoto').onclick = function () { if (needTeam()) $('photoInput').click(); };
    $('photoInput').onchange = function (e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      if (!/^image\//.test(f.type)) { toast('사진 파일을 골라 주세요.', true); return; }
      resizeImage(f, 1600, 0.85).then(function (url) {
        setLocal('photo', url);
        renderPhoto();
        toast('사진을 올리는 중이에요…');
        saveNow({ quiet: true });
      }).catch(function () { toast('사진을 읽지 못했습니다. 다른 사진으로 해 보세요.', true); });
    };
    $('btnPhotoDel').onclick = async function () {
      if (!app.local.photo || !needTeam()) return;
      var ok = await choose('사진을 지울까요?', '모둠 보고서에서 장치 사진이 지워집니다.', [{ label: '지우기', value: true, danger: true }, { label: '취소', value: false }]);
      if (!ok) return;
      setLocal('photo', '');
      renderPhoto();
      saveNow({ quiet: true });
    };
  }

  function resizeImage(file, max, quality) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * s); c.height = Math.round(h * s);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image')); };
      img.src = url;
    });
  }

  function renderPhoto() {
    var box = $('photoBox');

      ? '<img src="' + esc(app.local.photo) + '" alt="모둠 측정 장치 사진">'

  }

  function bindData() {
    $('btnCsvFile').onclick = function () { if (needTeam()) $('csvInput').click(); };
    $('csvInput').onchange = async function (e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      var text = await readTextFile(f);
      var p = S.parseCsv(text);
      if (p.error) { toast(p.error, true); return; }
      if (!p.rows.length) { toast('측정 기록이 없는 파일입니다.', true); return; }
      if (!p.hasPlace) toast('이 파일에는 장소 열이 없어 장소별 비교가 어렵습니다. 측정 창에서 장소 이름을 쓰고 기록하세요.', true);
      await addRows(p.rows);
    };
    $('btnCsvDown').onclick = function () {
      if (!app.rows.length) { toast('내려받을 측정 자료가 없습니다.'); return; }
      download(new Blob([S.toCsv(app.rows, { bom: true })], { type: 'text/csv;charset=utf-8' }), teamLabel(app.me.team) + '_측정자료_' + S.nowParts().stamp + '.csv');
    };
    $('btnCsvClear').onclick = async function () {
      if (!app.rows.length || !needTeam()) return;
      var ok = await choose('측정 자료를 모두 비울까요?', '모둠원 모두의 측정 기록 ' + app.rows.length + '건이 지워집니다.\n필요하면 먼저 [모둠 자료 내려받기]로 보관해 두세요.', [
        { label: '비우기', value: true, danger: true }, { label: '취소', value: false }]);
      if (!ok) return;
      setCsvRows([], true);
      saveNow({ quiet: true });
    };
    $('dataSummary').addEventListener('click', function (e) {
      if (!e.target.closest('[data-undo]') || !app.csvUndo) return;
      setCsvRows(app.csvUndo, false);
      app.csvUndo = null;
      renderData();
      saveNow({ quiet: true });
      toast('바꾸기 전 측정 자료로 되돌렸습니다.');
    });
  }

  function readTextFile(file) {
    return file.arrayBuffer().then(function (buf) {
      try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
      catch (e) { try { return new TextDecoder('euc-kr').decode(buf); } catch (e2) { return new TextDecoder('utf-8').decode(buf); } }
    });
  }

  async function addRows(newRows) {
    var mode = 'replace';
    if (app.rows.length) {
      mode = await choose('이미 모둠 측정 자료가 있습니다', '모둠 자료에 ' + app.rows.length + '건이 있습니다. 새 자료 ' + newRows.length + '건을 어떻게 넣을까요?', [
        { label: '이어 붙이기', value: 'append', primary: true }, { label: '기존 자료를 지우고 바꾸기', value: 'replace', danger: true }, { label: '취소', value: null }]);
      if (!mode) return;
    }
    setCsvRows(mode === 'append' ? app.rows.concat(newRows) : newRows, mode === 'replace');
    saveNow({ quiet: true });
    toast('측정 자료 ' + newRows.length + '건을 넣었습니다. (모둠 자료 모두 ' + app.rows.length + '건)');
  }

   
  function setCsvRows(rows, keepUndo) {
    if (keepUndo && app.rows.length) app.csvUndo = app.rows.slice();
    app.rows = rows;
    setLocal('csv', rows.length ? S.toCsv(rows) : '');
    renderData();
    if (app.page === 's5') onShowAnalysis();
  }

  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function activeFields(rows) { return S.FIELDS.filter(function (f) { return S.hasData(rows, f.key); }); }

  function renderData() {
    var sum = $('dataSummary');
    if (!sum) return;
    var rows = app.rows, groups = S.byPlace(rows);
    var undo = app.csvUndo ? '<div class="info" style="margin-top:10px">측정 자료를 바꿨습니다. <button type="button" class="btn btn-sm" data-undo>↶ 바꾸기 전 자료(' + app.csvUndo.length + '건)로 되돌리기</button></div>' : '';
    if (!rows.length) {
      sum.innerHTML = '<div class="muted small" style="margin-top:10px">' + (app.teamInfo.csvMissing ? '저장된 측정 파일을 찾을 수 없습니다. 측정 창에서 다시 보내 주세요.' : '아직 측정 자료가 없습니다. 측정 창의 [보고서로 보내기]나 CSV 파일 첨부로 넣으세요.') + '</div>' + undo;
      $('placeTable').innerHTML = '아직 측정 자료가 없습니다.';
      $('rawTable').innerHTML = '';
      return;
    }
    var first = rows[0], last = rows[rows.length - 1];
    var noPlace = rows.filter(function (r) { return !r.place; }).length;
    sum.innerHTML = '<div class="stat-row"><div class="stat">측정 기록<b>' + rows.length + '건</b></div><div class="stat">측정 장소<b>' + groups.length + '곳</b></div>' +
      '<div class="stat">측정 기간<b style="font-size:13px;font-family:inherit">' + esc((first.date || '') + ' ' + (first.time || '')) + '<br>~ ' + esc((last.date || '') + ' ' + (last.time || '')) + '</b></div></div>' +
      (noPlace ? '<div class="small" style="color:#b45309">장소 이름 없이 기록된 값 ' + noPlace + '건은 장소별 요약에서 빠집니다.</div>' : '') + undo;
    $('placeTable').innerHTML = placeTableHtml(groups, rows);
    $('rawTable').innerHTML = rawTableHtml(rows);
  }

  function placeTableHtml(groups, rows) {
    var fs = activeFields(rows);
    if (!groups.length) return '<div class="muted small">장소 이름이 있는 기록이 없습니다.</div>';
    return '<div class="table-wrap"><table class="tbl"><thead><tr><th>장소</th><th class="num">기록 수</th>' +
      fs.map(function (f) { return '<th class="num">' + esc(f.short) + (f.unit ? ' (' + esc(f.unit) + ')' : '') + '</th>'; }).join('') +
      '</tr></thead><tbody>' + groups.map(function (g) {
        return '<tr><td>' + esc(g.place) + '</td><td class="num">' + g.n + '</td>' + fs.map(function (f) { return '<td class="num">' + S.fmt(g.avg[f.key], f.avgDigits) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  function rawTableHtml(rows) {
    var fs = activeFields(rows);
    var gps = S.hasData(rows, 'lat');
    var lim = rows.slice(-200);
    return (rows.length > 200 ? '<div class="small muted">마지막 200건만 보여 줍니다. 전체는 [모둠 자료 내려받기]로 확인하세요.</div>' : '') +
      '<div class="table-wrap" style="max-height:360px;overflow:auto"><table class="tbl"><thead><tr><th>날짜</th><th>시간</th><th>장소</th>' +
      fs.map(function (f) { return '<th class="num">' + esc(f.short) + '</th>'; }).join('') + (gps ? '<th class="num">위도</th><th class="num">경도</th>' : '') + '</tr></thead><tbody>' +
      lim.map(function (r) {
        return '<tr><td class="nowrap">' + esc(r.date) + '</td><td class="nowrap">' + esc(r.time) + '</td><td>' + esc(r.place) + '</td>' +
          fs.map(function (f) { return '<td class="num">' + S.fmt(r[f.key], f.digits) + '</td>'; }).join('') +
          (gps ? '<td class="num">' + S.fmt(r.lat, 5) + '</td><td class="num">' + S.fmt(r.lng, 5) + '</td>' : '') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  

  var charts = null, map = null, mapLayer = null, pickMarker = null;

  function onShowAnalysis() {
    renderCompare();
    $('chartMsg').textContent = app.rows.length ? '' : '측정 자료가 생기면 그래프가 그려집니다.';
    loadScript(CHART_URL).then(function () {
      if (!charts) charts = S.createCharts($('cPollution'), $('cClimate'));
      S.setChartData(charts, app.rows);
    }).catch(function () { $('chartMsg').textContent = '그래프 프로그램을 불러오지 못했습니다(인터넷 연결 확인). 표와 막대 비교는 계속 쓸 수 있어요.'; });
    initMap();
  }

  var PREFER = ['pm25', 'co2', 'voc', 'ph', 'temp', 'humi', 'wtemp'];
  var REFS = {
    pm25: '참고: 초미세먼지(PM2.5) 대기환경기준은 24시간 평균 35µg/m³입니다.',
    co2: '참고: 학교 교실의 이산화탄소 유지 기준은 1,000ppm입니다.',
    ph: '참고: 하천의 좋은 물 상태는 대체로 pH 6.5~8.5 범위입니다.'
  };

  function renderCompare() {
    var sel = $('cmpField');
    var fs = activeFields(app.rows);
    var cur = sel.value;
    sel.innerHTML = fs.length ? fs.map(function (f) { return '<option value="' + f.key + '">' + esc(f.label) + '</option>'; }).join('') : '<option value="">측정 자료 없음</option>';
    if (cur && fs.some(function (f) { return f.key === cur; })) sel.value = cur;
    else { var p = PREFER.filter(function (k) { return fs.some(function (f) { return f.key === k; }); })[0]; if (p) sel.value = p; }
    drawBars();
  }

  function drawBars() {
    var key = $('cmpField').value, f = S.FIELD[key];
    var all = S.byPlace(app.rows);
    var groups = all.filter(function (g) { return f && g.avg[key] != null; });
    if (!f || !groups.length) {
      $('cmpBars').innerHTML = '<div class="muted small">장소 이름이 있는 측정 자료가 생기면 장소끼리 비교할 수 있어요.</div>';
      $('cmpNote').textContent = '';
      return;
    }
    var maxV = key === 'ph' ? 14 : Math.max.apply(null, groups.map(function (g) { return g.avg[key]; }));
    if (!(maxV > 0)) maxV = 1;
    var ex = S.extremes(all, key);
    $('cmpBars').innerHTML = groups.map(function (g) {
      var v = g.avg[key], w = Math.max(2, Math.min(100, v / maxV * 100));
      var hi = ex && g === ex.max, lo = ex && g === ex.min;
      return '<div class="bar-row"><span class="lbl" title="' + esc(g.place) + '">' + esc(g.place) + '</span><span class="track"><i style="width:' + w.toFixed(1) + '%;background:' + (hi ? '#e11d48' : (lo ? '#10b981' : f.color)) + '"></i></span><span class="val">' + S.fmt(v, f.avgDigits) + ' ' + esc(f.unit) + '</span></div>';
    }).join('');
    var note = ex ? '가장 높은 곳: <b>' + esc(ex.max.place) + '</b> (' + S.fmt(ex.max.avg[key], f.avgDigits) + ' ' + esc(f.unit) + ') · 가장 낮은 곳: <b>' + esc(ex.min.place) + '</b> (' + S.fmt(ex.min.avg[key], f.avgDigits) + ' ' + esc(f.unit) + ')' : '두 곳 이상에서 측정해야 비교할 수 있어요.';
    if (REFS[key]) note += '<br>' + esc(REFS[key]);
    $('cmpNote').innerHTML = note;
  }

  function initMap() {
    if (map) { setTimeout(function () { map.invalidateSize(); }, 60); renderMarkers(); return; }
    loadCss(LEAFLET_CSS);
    loadScript(LEAFLET_JS).then(function () {
      if (map || !$('map')) return;
      map = L.map('map').setView([app.settings.mapLat || 37.4912, app.settings.mapLng || 126.712], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
      mapLayer = L.layerGroup().addTo(map);
      map.on('click', function (e) {
        $('mkLat').value = e.latlng.lat.toFixed(6);
        $('mkLng').value = e.latlng.lng.toFixed(6);
        if (pickMarker) pickMarker.setLatLng(e.latlng);
        else pickMarker = L.circleMarker(e.latlng, { radius: 7, color: '#e11d48', weight: 3 }).addTo(map);
        $('mkName').focus();
      });
      renderMarkers();
      setTimeout(function () { map.invalidateSize(); }, 60);
    }).catch(function () { $('mapMsg').textContent = '지도를 불러오지 못했습니다(인터넷 연결 확인). 장소 목록은 계속 쓸 수 있어요.'; });
  }

  function renderMarkers() {
    var list = $('markerList');
    if (!list) return;
    var ms = app.local.mapData || [];
    list.innerHTML = ms.length ? ms.map(function (m, i) {
      return '<span class="mk">📍 ' + esc(m.name) + (m.summary ? ' <span class="muted">' + esc(m.summary) + '</span>' : '') + '<button type="button" data-mk-del="' + i + '" title="지우기">×</button></span>';
    }).join('') : '<span class="muted small">아직 지도에 표시한 장소가 없습니다.</span>';
    if (map && mapLayer) {
      mapLayer.clearLayers();
      var bounds = [];
      ms.forEach(function (m) {
        L.marker([m.lat, m.lng]).addTo(mapLayer).bindPopup('<b>' + esc(m.name) + '</b>' + (m.summary ? '<br>' + esc(m.summary) : ''));
        bounds.push([m.lat, m.lng]);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 17 });
    }
  }

  function summaryOf(g) {
    return activeFields(app.rows).filter(function (f) { return g.avg[f.key] != null; }).slice(0, 4)
      .map(function (f) { return f.short + ' ' + S.fmt(g.avg[f.key], f.avgDigits); }).join(', ');
  }

  function bindMap() {
    $('cmpField').onchange = drawBars;
    $('btnMkAdd').onclick = function () {
      if (!needTeam()) return;
      var name = $('mkName').value.trim(), lat = Number($('mkLat').value), lng = Number($('mkLng').value);
      if (!name) { toast('장소 이름을 쓰세요.', true); return; }
      if (!$('mkLat').value || !$('mkLng').value || !isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) { toast('지도를 눌러 위치를 고르거나 위도·경도를 숫자로 쓰세요.', true); return; }
      var ms = clone(app.local.mapData || []);
      ms.push({ name: name, lat: lat, lng: lng, summary: $('mkSum').value.trim() });
      setLocal('mapData', ms);
      renderMarkers();
      $('mkName').value = ''; $('mkSum').value = ''; $('mkLat').value = ''; $('mkLng').value = '';
      if (pickMarker && map) { map.removeLayer(pickMarker); pickMarker = null; }
    };
    $('markerList').onclick = function (e) {
      var b = e.target.closest('[data-mk-del]');
      if (!b || !needTeam()) return;
      var ms = clone(app.local.mapData || []);
      ms.splice(Number(b.getAttribute('data-mk-del')), 1);
      setLocal('mapData', ms);
      renderMarkers();
    };
    $('btnMapFromData').onclick = async function () {
      if (!needTeam()) return;
      var groups = S.byPlace(app.rows).filter(function (g) { return g.lat != null && g.lng != null; });
      if (!groups.length) { toast('GPS 위치가 기록된 측정 자료가 없습니다. 지도를 눌러 직접 추가하세요.', true); return; }
      if ((app.local.mapData || []).length) {
        var ok = await choose('지도 표시를 새로 만들까요?', '지금 표시된 장소를 지우고, 측정 자료의 장소별 평균 위치 ' + groups.length + '곳으로 바꿉니다.', [
          { label: '새로 만들기', value: true, primary: true }, { label: '취소', value: false }]);
        if (!ok) return;
      }
      setLocal('mapData', groups.map(function (g) { return { name: g.place, lat: Number(g.lat.toFixed(6)), lng: Number(g.lng.toFixed(6)), summary: summaryOf(g) }; }));
      renderMarkers();
    };
    $('btnMapClear').onclick = async function () {
      if (!(app.local.mapData || []).length || !needTeam()) return;
      var ok = await choose('지도 표시를 모두 지울까요?', '모둠 보고서의 지도 표시가 모두 지워집니다.', [{ label: '지우기', value: true, danger: true }, { label: '취소', value: false }]);
      if (!ok) return;
      setLocal('mapData', []);
      renderMarkers();
    };
  }

  

  function bindPublish() {
    var sw = $('pubSwitch');
    var toggle = function () {
      if (!needTeam()) return;
      var next = !app.local.published;
      if (next && !(hasText('p6_title') && hasText('p6_solution'))) { toast('6-1 해결안 제목과 6-4 해결 방법을 먼저 쓰세요.', true); return; }
      setLocal('published', next);
      renderPublish();
      saveNow({ quiet: true });
      toast(next ? '해결안을 공개했어요. 다른 모둠이 피드백을 남길 수 있습니다.' : '공개를 멈췄어요.');
    };
    sw.onclick = toggle;
    sw.onkeydown = function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } };
    $('btnProposal').onclick = printProposal;
  }

  function renderPublish() {
    var sw = $('pubSwitch');
    if (!sw) return;
    var on = !!app.local.published;
    sw.classList.toggle('on', on);
    sw.setAttribute('aria-checked', on ? 'true' : 'false');
    $('pubText').textContent = on ? '다른 모둠에게 공개 중' : '공개하지 않음';
    $('pubSub').textContent = on ? '다른 모둠이 7단계에서 우리 해결안을 보고 피드백을 남길 수 있어요.'
      : (hasText('p6_title') && hasText('p6_solution') ? '눌러서 공개하세요.' : '6-1 제목과 6-4 해결 방법을 쓰면 공개할 수 있어요.');
  }

  var PRINT_CSS = '@page{size:A4;margin:14mm}body{font-family:"Malgun Gothic","맑은 고딕","Nanum Gothic","나눔고딕",sans-serif;color:#1e293b;font-size:12.5px;line-height:1.6;margin:0}' +
    '.doc{max-width:760px;margin:0 auto;padding:16px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #059669;padding-bottom:6px;margin-bottom:12px;font-size:11.5px;color:#475569}' +
    'h1{font-size:21px;margin:4px 0 2px;color:#064e3b}h2{font-size:14.5px;margin:16px 0 6px;color:#064e3b;border-left:4px solid #10b981;padding-left:8px;break-after:avoid}' +
    'h3{font-size:13px;margin:10px 0 4px}.box{white-space:pre-wrap;word-break:break-word;border:1px solid #cbd5e1;border-radius:6px;padding:7px 9px;min-height:22px}' +
    '.empty{color:#94a3b8}.meta{color:#64748b;font-size:11px;font-weight:400}.lead{font-size:13.5px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:8px 10px}' +
    'table{border-collapse:collapse;width:100%;font-size:11.5px;margin:4px 0}th,td{border:1px solid #cbd5e1;padding:4px 6px;text-align:left;vertical-align:top}th{background:#f1f5f9}td.n{text-align:right}' +

    '.noprint{position:fixed;top:10px;right:10px}.noprint button{font:inherit;font-weight:700;padding:8px 14px;border-radius:8px;border:1px solid #059669;background:#059669;color:#fff;cursor:pointer}' +
    '@media print{.noprint{display:none}.doc{padding:0}}';

  function openPrintWindow(title, bodyHtml) {
    var w = null;
    try { w = window.open('', '_blank'); } catch (e) { w = null; }
    if (!w) { toast('팝업이 막혀 인쇄 창을 열지 못했습니다. 주소창 오른쪽에서 팝업을 허용해 주세요.', true); return; }
    w.document.open();
    w.document.write('<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>' + esc(title) + '</title><style>' + PRINT_CSS + '</style></head><body>' +
      '<div class="noprint"><button type="button" onclick="window.print()">🖨 인쇄 · PDF로 저장</button></div><div class="doc">' + bodyHtml + '</div></body></html>');
    w.document.close();
    setTimeout(function () { try { w.focus(); w.print(); } catch (e) {   } }, 700);
  }

  function pBox(v) { return v && String(v).trim() ? '<div class="box">' + esc(v) + '</div>' : '<div class="box empty">(비어 있음)</div>'; }

  function printProposal() {
    var v = app.local, groups = S.byPlace(app.rows), fs = activeFields(app.rows);
    var roles = (v.roles || []).filter(function (r) { return r.role || r.task; });
    var html = '<div class="top"><span>' + esc(app.settings.school || BOOT.school || '') + ' · 환경 오염 PBL 탐구</span><span>해결안 발표 자료</span></div>' +

  function bindGallery() {
    $('btnGallery').onclick = function () { loadGallery(true); };
    $('gallery').addEventListener('click', async function (e) {
      var b = e.target.closest('[data-fb-save],[data-fb-del]');
      if (!b) return;
      var team = b.getAttribute('data-team');
      var card = b.closest('.g-card');
      if (b.hasAttribute('data-fb-del')) {
        var ok = await choose('피드백을 지울까요?', teamLabel(team) + '에 남긴 내 피드백이 지워집니다.', [{ label: '지우기', value: true, danger: true }, { label: '취소', value: false }]);
        if (!ok) return;
        try {
          var r = await api('apiDeleteFeedback', app.token, team);
          toast(r.ok ? r.message : r.message, !r.ok);
          app.myFeedback = (app.myFeedback || []).filter(function (f) { return f.toTeam !== team; });
          loadGallery(true);
        } catch (err) { toast('지우지 못했습니다. 연결을 확인하세요.', true); }
        return;
      }
      var data = {};
      ['praise', 'question', 'suggest'].forEach(function (k) { data[k] = card.querySelector('[data-f="' + k + '"]').value; });
      if (!data.praise.trim() && !data.question.trim() && !data.suggest.trim()) { toast('세 칸 중 하나 이상을 써 주세요.', true); return; }
      b.disabled = true;
      var label = b.textContent;
      b.textContent = '저장 중…';
      try {
        var res = await api('apiSaveFeedback', app.token, team, data);
        if (!res.ok) { toast(res.message, true); return; }
        toast(res.message);
        var g = (app.gallery || []).find(function (x) { return x.team === team; });
        if (g) g.mine = { praise: data.praise, question: data.question, suggest: data.suggest, savedAt: res.savedAt };
        app.myFeedback = (app.myFeedback || []).filter(function (f) { return f.toTeam !== team; }).concat([{ toTeam: team, savedAt: res.savedAt }]);
        renderGallery();
      } catch (err) {
        toast('저장하지 못했습니다. 연결을 확인하세요.', true);
      } finally {
        b.disabled = false;
        b.textContent = label;
      }
    });
  }

  function bindBuilder() {
    $('sensorGrid').addEventListener('click', function (e) {
      var b = e.target.closest('[data-sensor]');
      if (!b) return;
      var k = b.getAttribute('data-sensor');
      sensorSel[k] = !sensorSel[k];
      try { localStorage.setItem('envPbl.sensors', JSON.stringify(sensorSel)); } catch (err) {   }
      renderBuilder();
    });
    $('btnCopyCode').onclick = function () {
      var text = $('codeBox').textContent;
      var done = function () { toast('코드를 복사했어요. 아두이노 IDE에 붙여 넣으세요.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (err) { toast('복사하지 못했습니다. 코드 상자를 드래그해서 복사하세요.', true); }
        ta.remove();
      }
    };
    renderBuilder();
  }

    }).join('') : '<span class="small muted">' + (list.length ? '고른 센서는 따로 설치할 라이브러리가 없습니다.' : '센서를 고르면 필요한 라이브러리가 나타납니다.') + '</span>';
    $('codeBox').textContent = list.length ? arduinoCode() : '// 1단계에서 센서를 하나 이상 고르세요.';

  function circuitSvg(list) {
    if (!list.length) return '<div class="muted small">센서를 고르면 회로도가 그려집니다.</div>';
    var sig = [];
    list.forEach(function (s) { s.pins.forEach(function (p) { if (p[1] !== '5V' && p[1] !== 'GND' && sig.indexOf(p[1]) < 0) sig.push(p[1]); }); });
    sig.sort(function (a, b) { return PIN_ORDER.indexOf(a) - PIN_ORDER.indexOf(b); });
    var ardPins = ['5V', 'GND'].concat(sig);
    var ardTop = 34, rowH = 30, pinY = {};
    ardPins.forEach(function (p, i) { pinY[p] = ardTop + 46 + i * rowH; });
    var ardH = 46 + ardPins.length * rowH + 10;
    var sx = 560, sw = 210, y = 34, blocks = [];
    list.forEach(function (s) { var h = 44 + s.pins.length * 22; blocks.push({ s: s, y: y, h: h }); y += h + 14; });
    var H = Math.max(ardTop + ardH + 16, y + 6), W = 790, railP = 300, railN = 330;
    var o = [];
    o.push('<svg class="circuit" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, Nanum Gothic, sans-serif" role="img" aria-label="아두이노와 센서 연결 회로도">');
    o.push('<rect x="282" y="10" width="66" height="' + (H - 20) + '" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>');
    o.push('<text x="315" y="26" text-anchor="middle" font-size="10" fill="#64748b" font-weight="700">브레드보드</text>');
    o.push('<line x1="' + railP + '" y1="34" x2="' + railP + '" y2="' + (H - 16) + '" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>');
    o.push('<line x1="' + railN + '" y1="34" x2="' + railN + '" y2="' + (H - 16) + '" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>');
    o.push('<text x="' + railP + '" y="' + (H - 2) + '" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="800">+</text>');
    o.push('<text x="' + railN + '" y="' + (H - 2) + '" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="800">−</text>');
    o.push('<rect x="20" y="' + ardTop + '" width="176" height="' + ardH + '" rx="12" fill="#0e7490"/>');
    o.push('<text x="34" y="' + (ardTop + 26) + '" font-size="15" fill="#fff" font-weight="800">Arduino UNO</text>');
    function wire(d, color) {
      if (color === '#e2e8f0') o.push('<path d="' + d + '" fill="none" stroke="#64748b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>');
      o.push('<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>');
    }
    function dot(x, yy, c) { o.push('<circle cx="' + x + '" cy="' + yy + '" r="4.5" fill="' + (c || '#0f172a') + '" stroke="#fff" stroke-width="1.5"/>'); }
    wire('M196 ' + pinY['5V'] + ' H' + railP, '#ef4444');
    wire('M196 ' + pinY.GND + ' H' + railN, '#1f2937');
    dot(railP, pinY['5V'], '#ef4444');
    dot(railN, pinY.GND, '#1f2937');
    var lane = 0;
    blocks.forEach(function (b) {
      var s = b.s;
      s.pins.forEach(function (p, j) {
        var py = b.y + 44 + j * 22;
        if (p[1] === '5V') { wire('M' + sx + ' ' + py + ' H' + railP, p[2]); dot(railP, py, '#ef4444'); }
        else if (p[1] === 'GND') { wire('M' + sx + ' ' + py + ' H' + railN, p[2]); dot(railN, py, '#1f2937'); }
        else {
          var lx = 372 + lane * 22; lane++;
          wire('M' + sx + ' ' + py + ' H' + lx + ' V' + pinY[p[1]] + ' H196', p[2]);
        }
      });
    });
    blocks.forEach(function (b) {
      var s = b.s;
      o.push('<rect x="' + sx + '" y="' + b.y + '" width="' + sw + '" height="' + b.h + '" rx="10" fill="#fff" stroke="' + s.color + '" stroke-width="2.5"/>');
      o.push('<text x="' + (sx + 12) + '" y="' + (b.y + 18) + '" font-size="12.5" font-weight="800" fill="' + s.color + '">' + esc(s.name) + '</text>');
      o.push('<text x="' + (sx + 12) + '" y="' + (b.y + 32) + '" font-size="10" fill="#64748b">' + esc(s.model) + '</text>');
      s.pins.forEach(function (p, j) {
        var py = b.y + 44 + j * 22;
        o.push('<circle cx="' + sx + '" cy="' + py + '" r="5" fill="' + p[2] + '" stroke="#334155" stroke-width="1.2"/>');
        o.push('<text x="' + (sx + 12) + '" y="' + (py + 4) + '" font-size="11" fill="#334155" font-weight="700">' + esc(p[0]) + '</text>');
      });
    });
    ardPins.forEach(function (p) {
      o.push('<rect x="184" y="' + (pinY[p] - 6) + '" width="14" height="12" rx="2" fill="#fde68a" stroke="#92400e"/>');
      o.push('<text x="176" y="' + (pinY[p] + 4) + '" text-anchor="end" font-size="12" fill="#fff" font-weight="800">' + p + '</text>');
    });
    o.push('</svg>');
    return o.join('');
  }

  function arduinoCode() {
    var on = sensorSel;
    var names = chosenSensors().map(function (s) { return s.name; }).join(', ');
    var c = [];
    c.push('// [환경 오염 PBL 탐구] 아두이노 측정 코드');
    c.push('// 고른 센서: ' + names);
    c.push('// 2초마다 측정값을 한 줄(JSON)로 보냅니다. 시리얼 속도: 9600 bps');
    c.push('');
    c.push('#include <Wire.h>');
    if (on.air) c.push('#include <am1008w_k_i2c.h>', 'AM1008W_K_I2C am1008w_k;          // 공기질: SDA→A4, SCL→A5');
    if (on.dht) c.push('#include <DHT.h>', 'DHT dht(2, DHT11);                // 온습도: DATA→D2');
    if (on.water) c.push('#include <OneWire.h>', '#include <DallasTemperature.h>', 'OneWire oneWire(5);               // 수온: DAT→D5', 'DallasTemperature waterSensor(&oneWire);');
    if (on.gps) c.push('#include <SoftwareSerial.h>', '#include <TinyGPS++.h>', 'SoftwareSerial gpsSerial(3, 4);   // GPS: TX→D3, RX→D4', 'TinyGPSPlus gps;');
    c.push('');
    c.push('unsigned long prevMillis = 0;');
    c.push('bool firstField = true;');
    c.push('');
    c.push('// "이름":값 형태로 한 칸을 보낸다');
    c.push('void field(const char* key) {');
    c.push('  Serial.print(firstField ? "{\\"" : ",\\"");');
    c.push('  Serial.print(key);');
    c.push('  Serial.print("\\":");');
    c.push('  firstField = false;');
    c.push('}');
    c.push('');
    c.push('void setup() {');
    c.push('  Serial.begin(9600);');
    c.push('  Wire.begin();');
    if (on.air) c.push('  am1008w_k.begin();');
    if (on.dht) c.push('  dht.begin();');
    if (on.water) c.push('  waterSensor.begin();', '  waterSensor.setWaitForConversion(false);', '  waterSensor.requestTemperatures();');
    if (on.gps) c.push('  gpsSerial.begin(9600);');
    c.push('}');
    c.push('');
    c.push('void loop() {');
    if (on.gps) c.push('  while (gpsSerial.available() > 0) gps.encode(gpsSerial.read());');
    c.push('  if (millis() - prevMillis < 2000) return;');
    c.push('  prevMillis = millis();');
    c.push('  firstField = true;');
    if (on.air) {
      c.push('');
      c.push('  // 공기질: 읽기에 실패하면 null을 보내 측정 창이 "읽기 실패"로 표시한다');
      c.push('  uint8_t ret = am1008w_k.read_data_command();');
      c.push('  field("pm25"); if (ret == 0) Serial.print(am1008w_k.get_pm2p5()); else Serial.print("null");');
      c.push('  field("co2");  if (ret == 0) Serial.print(am1008w_k.get_co2());   else Serial.print("null");');
      c.push('  field("voc");  if (ret == 0) Serial.print(am1008w_k.get_voc());   else Serial.print("null");');
    }
    if (on.ph) {
      c.push('');
      c.push('  // pH: 전압(phv)을 함께 보내 측정 창에서 보정한다');
      c.push('  float phV = analogRead(A0) * 5.0 / 1024.0;');
      c.push('  field("phv"); Serial.print(phV, 3);');
      c.push('  field("ph");  Serial.print(3.5 * phV, 2);');
    }
    if (on.dht) {
      c.push('');
      c.push('  // 온습도: 읽기에 실패하면 nan이 나가고 측정 창이 "읽기 실패"로 표시한다');
      c.push('  field("temp"); Serial.print(dht.readTemperature(), 1);');
      c.push('  field("humi"); Serial.print(dht.readHumidity(), 1);');
    }
    if (on.water) {
      c.push('');
      c.push('  // 수온: 지난번에 요청한 값을 읽고 다음 측정을 미리 요청한다 (-127이면 연결 확인)');
      c.push('  field("wtemp"); Serial.print(waterSensor.getTempCByIndex(0), 1);');
      c.push('  waterSensor.requestTemperatures();');
    }
    if (on.gps) {
      c.push('');
      c.push('  // GPS: 위치를 못 잡았으면 0을 보낸다');
      c.push('  field("lat"); Serial.print(gps.location.isValid() ? gps.location.lat() : 0.0, 6);');
      c.push('  field("lng"); Serial.print(gps.location.isValid() ? gps.location.lng() : 0.0, 6);');
      c.push('  field("sat"); Serial.print(gps.satellites.isValid() ? (int)gps.satellites.value() : 0);');
    }
    c.push('');
    c.push('  Serial.println("}");');
    c.push('}');
    return c.join('\n');
  }

  window.receiveStationData = function (data, mode) {

      var info = window.stationReportInfo();

      var p = S.parseCsv(data && data.csv || '');
      if (p.error || !p.rows.length) return { ok: false, message: '보낸 자료를 읽지 못했습니다. CSV 파일로 저장해 4단계에 첨부하세요.' };
      var rows = mode === 'replace' ? p.rows : app.rows.concat(p.rows);
      setCsvRows(rows, mode === 'replace');
      saveNow({ quiet: true });
      return { ok: true, message: p.rows.length + '건을 보냈습니다. (모둠 자료 모두 ' + rows.length + '건 · 웹앱에서 자동 저장)' };
    } catch (e) {
      return { ok: false, message: '보고서에 넣지 못했습니다: ' + (e && e.message ? e.message : e) };

  function renderStationChip() {
    var chip = $('stationChip');
    var alive = app.station && Date.now() - (app.stationAt || 0) < 10000;
    if (!alive) {
      chip.classList.add('hidden');
      if ($('stationStatus')) $('stationStatus').textContent = '측정 창이 열려 있지 않습니다.';
      return;
    }
    var st = app.station;
    chip.classList.remove('hidden');
    chip.classList.toggle('on', !!st.connected);
    chip.classList.toggle('rec', !!st.recording);
    var txt = '관측소 ' + (st.connected ? '연결됨' : '연결 안 됨') + (st.recording ? ' · 기록 중' : '') + (st.unsent > 0 ? ' · 보내지 않은 ' + st.unsent + '건' : '');
    $('stationChipText').textContent = txt;
    if ($('stationStatus')) $('stationStatus').textContent = '측정 창이 열려 있습니다 · ' + txt.replace('관측소 ', '') + (st.place ? ' · 장소: ' + st.place : '') + ' · 기록 ' + st.rows + '건';
  }
